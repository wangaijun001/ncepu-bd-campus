<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华电保定 · 校园通</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1e7a4f;--green-d:#124a30;--green-l:#e8f4ee;--blue:#0b62c4;--gray:#68788e;--line:#dde6e0;--amber-bg:#fdf6ec;--amber:#d99a2b;--amber-t:#7a5a1e}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1f2733;background:#f4f7f5;line-height:1.65}
a{color:var(--blue);text-decoration:none;word-break:break-all}
a:hover{text-decoration:underline}
img{max-width:100%}
/* ===== 顶部导航 ===== */
nav{position:sticky;top:0;z-index:99;background:#fff;border-bottom:2px solid var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;color:var(--green-d);margin-right:10px;white-space:nowrap}
.logo span{color:var(--green)}
.nav-in a.nl{padding:5px 11px;border-radius:6px;color:#2c3a4d;font-size:14px;white-space:nowrap}
.nav-in a.nl:hover,.nav-in a.nl.on{background:var(--green-l);color:var(--green-d);font-weight:bold}
.spacer{flex:1}
#q{border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:13px;width:180px;outline:none}
#q:focus{border-color:var(--green)}
#qCount{font-size:11px;color:var(--gray);width:100%;text-align:right;padding:0 16px;display:none}
/* ===== 布局 ===== */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.hero{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.hero-img{position:relative;cursor:zoom-in}
.hero-img img{width:100%;display:block}
.hero-img .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:12px;padding:22px 14px 8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.panel>h2{font-size:20px;color:var(--green-d);border-left:5px solid var(--green);padding-left:10px;margin-bottom:6px}
.panel>.pdesc{color:var(--gray);font-size:12.5px;margin-bottom:12px}
h3.blk{font-size:15.5px;color:#124a30;margin:20px 0 8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
h3.blk::before{content:"▾";color:var(--green);transition:.2s;font-size:12px}
h3.blk.closed::before{transform:rotate(-90deg)}
h3.blk .cnt{font-size:11px;color:#fff;background:var(--green);border-radius:10px;padding:0 8px;font-weight:normal}
.bgroup{margin-bottom:6px}
/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;transition:.15s}
.card:hover{box-shadow:0 3px 12px rgba(30,122,79,.13);border-color:#bcd9ca}
.card .t{font-weight:bold;font-size:14px;color:var(--green-d);margin-bottom:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.badge{font-size:10.5px;color:#fff;background:var(--green);border-radius:4px;padding:0 6px;font-weight:normal;white-space:nowrap}
.badge.bA{background:#c0392b}.badge.bB{background:#d4791f}.badge.bC{background:#2c7fb8}.badge.bX{background:#5b8c5a}
.row{display:flex;gap:8px;margin:3px 0;font-size:12.8px}
.k{flex:0 0 58px;color:var(--gray);font-size:11.5px;text-align:justify;text-align-last:justify}
.v{flex:1;color:#2c3a4d}
.src{font-size:11px;color:#9aa7b5;margin-top:5px;border-top:1px dashed #e7ede9;padding-top:4px}
.src a{color:#7f96ab}
.steps{counter-reset:st}
.step{display:flex;gap:9px;margin:7px 0;font-size:13.5px}
.step::before{counter-increment:st;content:counter(st);flex:0 0 20px;height:20px;line-height:20px;text-align:center;background:var(--green);color:#fff;border-radius:50%;font-size:11px;font-weight:bold}
.note{background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:4px;padding:7px 11px;margin:8px 0;font-size:12.5px;color:var(--amber-t)}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;margin:8px 0}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--green-l);color:var(--green-d);white-space:nowrap}
.imgrow{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.imgrow figure{flex:1;min-width:260px;text-align:center}
.imgrow img{border:1px solid var(--line);border-radius:8px;width:100%}
figcaption{font-size:11px;color:var(--gray);margin-top:3px}
/* 筛选chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.chip{border:1px solid var(--green);color:var(--green-d);background:#fff;border-radius:16px;padding:3px 14px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--green);color:#fff;font-weight:bold}
select.deptSel{border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12.5px;color:#2c3a4d;background:#fff;outline:none}
/* 地图灯箱 */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:8px}
/* 快捷入口 */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick a{background:var(--green-l);border:1px solid #cfe6da;border-radius:9px;padding:10px;text-align:center;font-size:13px;color:var(--green-d);font-weight:bold;transition:.15s}
.quick a:hover{background:var(--green);color:#fff;text-decoration:none;transform:translateY(-2px)}
.quick a small{display:block;font-weight:normal;font-size:10.5px;margin-top:2px;opacity:.75}
#top{position:fixed;right:22px;bottom:26px;background:var(--green);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;display:none;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:98}
.modtag{display:inline-block;background:var(--green);color:#fff;font-size:12px;border-radius:5px;padding:1px 10px;margin-right:8px;vertical-align:middle}
.lurl{display:inline-block;color:#8ba3b8;font-size:10.5px;margin-left:5px;word-break:break-all;font-weight:normal}
.quick a small.u{color:#5f7488;opacity:1}
/* 互动地图 */
.imap{position:relative;width:fit-content;max-width:100%;margin:0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#dfe7ee}
.imap img.mapbase{display:block;max-height:74vh;width:auto;max-width:100%}
.mdot{position:absolute;width:15px;height:15px;margin:-15px 0 0 -7.5px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);cursor:pointer;padding:0;z-index:5;transition:transform .12s}
.mdot:hover{transform:scale(1.5)}
.mdot.on{transform:scale(1.55);box-shadow:0 0 0 3px rgba(30,122,79,.5),0 1px 4px rgba(0,0,0,.45)}
.mdot.c-gate{background:#c0392b}.mdot.c-teach{background:#1e7a4f}.mdot.c-dorm{background:#d4791f}.mdot.c-life{background:#2c7fb8}.mdot.c-sport{background:#5b8c5a}.mdot.c-spot{background:#8e44ad}
.imap-info{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 15px;margin:10px 0;font-size:13px}
.imap-info .t{font-weight:bold;font-size:15px;color:var(--green-d);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.imap-info .catb{font-size:10.5px;color:#fff;border-radius:4px;padding:0 6px;font-weight:normal;white-space:nowrap}
.imap-info ul{margin:7px 0 2px 20px;padding:0}
.imap-info li{margin:3px 0}
.ileg{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 2px;align-items:center}
.ileg .lg-t{font-size:12px;color:var(--gray)}
.ileg button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 10px;font-size:11.5px;cursor:pointer;color:#2c3a4d;display:inline-flex;align-items:center;gap:5px}
.ileg button .d{width:9px;height:9px;border-radius:50%;display:inline-block}
.ileg button.off{opacity:.35}
.imap-list{margin-top:6px}
.ilg{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline;margin:4px 0}
.ilg .cl{font-size:11px;color:var(--gray);flex:0 0 58px;text-align:justify;text-align-last:justify}
.ilg button{border:1px solid #cfe6da;background:#fff;border-radius:12px;padding:1px 9px;font-size:11.5px;cursor:pointer;color:var(--green-d)}
.ilg button:hover{background:var(--green-l)}
.ilg button.on{background:var(--green);color:#fff;font-weight:bold}
@media (max-width:640px){.mdot{width:19px;height:19px;margin:-19px 0 0 -9.5px;border-width:2px}}
/* 矢量地图 */
.imap-mode{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 8px}
.imap-mode .mt{font-size:12px;color:var(--gray)}
.imap-mode button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:2px 13px;font-size:12px;cursor:pointer;color:#2c3a4d}
.imap-mode button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:bold}
.imap-mode .mhint{font-size:11px;color:var(--gray)}
#vmapWrap{width:100%}
#vmap{display:block;width:100%;height:72vh;touch-action:none;cursor:grab;background:#eef4ef;border-radius:6px;user-select:none}
#vmap:active{cursor:grabbing}
.vbg{fill:#eef4ef}
.vgrass{fill:#dcead9}
.vroad{fill:none;stroke:#d3ded5;stroke-width:13;stroke-linecap:round}
.vwater{fill:none;stroke:#8ec8de;stroke-width:6;stroke-linecap:round;opacity:.85}
.vb{cursor:pointer}
.vb rect,.vb polygon,.vb ellipse{stroke-width:2.5;transition:.15s;vector-effect:non-scaling-stroke}
.vb.c-gate rect,.vb.c-gate polygon,.vb.c-gate ellipse{fill:rgba(192,57,43,.3);stroke:#c0392b}
.vb.c-teach rect,.vb.c-teach polygon,.vb.c-teach ellipse{fill:rgba(30,122,79,.2);stroke:#1e7a4f}
.vb.c-dorm rect,.vb.c-dorm polygon,.vb.c-dorm ellipse{fill:rgba(212,121,31,.32);stroke:#d4791f}
.vb.c-life rect,.vb.c-life polygon,.vb.c-life ellipse{fill:rgba(44,127,184,.25);stroke:#2c7fb8}
.vb.c-sport rect,.vb.c-sport polygon,.vb.c-sport ellipse{fill:rgba(91,140,90,.3);stroke:#5b8c5a}
.vb.c-spot rect,.vb.c-spot polygon,.vb.c-spot ellipse{fill:rgba(142,68,173,.18);stroke:#8e44ad}
.vb:hover{filter:brightness(.86)}
.vb.on rect,.vb.on polygon,.vb.on ellipse{stroke-width:4.5}
.vb text{font-size:17px;fill:#1f2733;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
#vmap g.c-dorm text{opacity:0;transition:.2s}
#vmap.z2 g.c-dorm text{opacity:1}
.vctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.vctl button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--green-d);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.morelink{float:right;font-size:12.5px;font-weight:normal}
footer{text-align:center;color:#9aa7b5;font-size:11.5px;padding:24px 16px 40px;line-height:2}
@media print{nav,#top,.chips{display:none}body{background:#fff}}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <div class="logo">华电保定<span>·校园通</span></div>
    <a class="nl on" data-view="home" href="javascript:void(0)" onclick="showView('home')">首页</a>
    <a class="nl" data-view="bldgs" href="javascript:void(0)" onclick="showView('bldgs')">楼宇</a>
    <a class="nl" data-view="svc" href="javascript:void(0)" onclick="showView('svc')">事务速查</a>
    <a class="nl" data-view="ai" href="javascript:void(0)" onclick="showView('ai')">AI 接入</a>
    <a class="nl" data-view="dev" href="javascript:void(0)" onclick="showView('dev')">开发者寄语</a>
    <div class="spacer"></div>
    <input id="q" type="search" placeholder="搜索内容…（如：数学建模 / 报修）">
  </div>
  <div id="qCount"></div>
</nav>

<div class="wrap" id="app">
  <div class="view" id="view-home">页面生成中…（若长期无响应请检查 data.js 是否在同目录）</div>
  <div class="view" id="view-bldgs" style="display:none"></div>
  <div class="view" id="view-bldg" style="display:none"></div>
  <div class="view" id="view-svc" style="display:none"></div>
  <div class="view" id="view-dev" style="display:none"></div>
  <div class="view" id="view-ai" style="display:none"><iframe src="ai-kit/index.html" title="校园 AI 接入指南" style="width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:12px;background:#fff"></iframe></div>
</div>

<div id="lightbox"><img id="lbimg" src="" alt=""></div>
<button id="top" title="回到顶部">↑</button>

<footer id="foot"></footer>

<script src="data.js?v=202610111940"></script>
<script>
const app = document.getElementById('app');
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// 每个超链接后面跟着链接的实际字符串
const urlTail = u => (u && u.startsWith('http')) ? `<span class="lurl">${esc(u)}</span>` : '';
const linkHtml = l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}${urlTail(l[1])}</a>`;
const quickTile = l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}<small>${esc(l[2]||'')}</small><small class="u">${esc(l[1])}</small></a>`;
const srcHtml = b => b.src ? `<div class="src">来源：${b.srcUrl ? `<a href="${esc(b.srcUrl)}" target="_blank" rel="noopener">${esc(b.src)}${urlTail(b.srcUrl)}</a>` : esc(b.src)}</div>` : '';

// ===== 正文裸网址 / 电话 → 可点击链接名 =====
const URL_RE = /([a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,})|(https?:\/\/[^\s<>"，。；、）】』》！!？?]+|www\.[^\s<>"，。；、）】』》]+|\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:com|cn|net|org|cc|io|xyz|top)(?:\/[^\s<>"，。；、）】』》]*)?)/gi;
function linkify(s){
  if(s==null) return '';
  return s.toString().split(/(<a\s[^>]*>[\s\S]*?<\/a>)|(<[^>]+>)/gi).map(seg=>{
    if(seg==null) return '';
    if(seg.charAt(0)==='<') return seg;
    let out = seg.replace(URL_RE, u=>{
      if(/^[^/@]+@[^/@]+\.[a-zA-Z]{2,}$/.test(u)) return `<a href="mailto:${u}">${u}</a>`;
      const raw = u.replace(/[.,;:!?)\]}"'’”』」]+$/, '');
      const tail = u.slice(raw.length);
      const href = (/^https?:\/\//i.test(raw) ? raw : 'https://' + raw).replace(/"/g,'%22');
      let txt = raw.replace(/^https?:\/\//i,'');
      if(txt.length>60) txt = txt.slice(0,57)+'…';
      return `<a href="${href}" target="_blank" rel="noopener" title="${esc(raw)}">${esc(txt)}</a>${tail}`;
    });
    out = out.replace(/0312-\d{7}|\b1[3-9]\d{9}\b/g, m=>`<a href="tel:${m}">${m}</a>`);
    return out;
  }).join('');
}

function cardHtml(c){
  const badge = c.badge ? `<span class="badge ${c.badgeCls||''}">${esc(c.badge)}</span>` : '';
  const rows = (c.rows||[]).map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${linkify(r[1])}</span></div>`).join('');
  const links = (c.links&&c.links.length) ? `<div class="row"><span class="k">链接</span><span class="v">${c.links.map(linkHtml).join('<br>')}</span></div>` : '';
  const tags = (c.tags||[]).join(' ').replace(/"/g,'&quot;');
  return `<div class="card" data-tags="${esc(tags)}">
    <div class="t">${badge}${esc(c.t)}</div>${rows}${links}
    ${c.note?`<div class="note">${linkify(c.note)}</div>`:''}${srcHtml(c)}</div>`;
}

function blockHtml(b){
  if(b.type==='cards'){
    const inner = `<div class="cards">${(b.items||[]).map(cardHtml).join('')}</div>`;
    const head = b.t ? `<div style="font-weight:bold;font-size:13.5px;color:#124a30;margin:10px 0 2px">${esc(b.t)}</div>` : '';
    return head + (b.filter ? filterBar(b) + inner : inner);
  }
  if(b.type==='table') return `<table>${(b.headers?`<tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`:'')}${b.rows.map(r=>`<tr>${r.map(c=>`<td>${linkify(c)}</td>`).join('')}</tr>`).join('')}</table>${srcHtml(b)}`;
  if(b.type==='steps') return `<div class="steps">${b.items.map(s=>`<div class="step"><span><b>${linkify(s.t)}</b>${s.t?'<br>':''}${linkify(s.d||'')}</span></div>`).join('')}</div>${srcHtml(b)}`;
  if(b.type==='note') return `<div class="note">${linkify(b.text)}</div>`;
  if(b.type==='text') return `<div style="font-size:13.5px;margin:6px 0">${linkify(b.html)}</div>`;
  if(b.type==='imgs') return `<div class="imgrow">${b.items.map(i=>`<figure><img src="${esc(i.src)}" loading="lazy" alt=""><figcaption>${esc(i.cap||'')}</figcaption></figure>`).join('')}</div>`;
  if(b.type==='links') return `<div class="quick">${b.items.map(quickTile).join('')}</div>`;
  if(b.type==='list') return `<ul style="margin:6px 0 6px 20px;font-size:13px">${b.items.map(x=>`<li style="margin:4px 0">${linkify(x)}</li>`).join('')}</ul>${srcHtml(b)}`;
  return '';
}

function groupHtml(g){
  const body = (b=>Array.isArray(b)?b:[b])(g.blocks).map(blockHtml).join('');
  const cntMatch = body.match(/class="card"/g);
  const cnt = g.count!=null ? g.count : (cntMatch?cntMatch.length:0);
  return `<div class="bgroup"><h3 class="blk" onclick="this.classList.toggle('closed');this.nextElementSibling.style.display=this.classList.contains('closed')?'none':''">${esc(g.t)}<span class="cnt">${cnt}</span></h3><div class="bbody">${body}</div></div>`;
}

function filterBar(b){
  const depts = [...new Set(b.items.map(c=>c.tags?c.tags[1]:'').filter(Boolean))].sort();
  return `<div class="chips">
    <span style="font-size:12px;color:var(--gray)">筛选：</span>
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="A">A类</button>
    <button class="chip" data-f="B">B类</button>
    <button class="chip" data-f="C">其他</button>
    <button class="chip" data-f="X">校内</button>
    <span style="font-size:12px;color:var(--gray)">院系（承办·建议参加）：</span><select class="deptSel"><option value="">全部</option>${depts.map(d=>`<option>${esc(d)}</option>`).join('')}</select>
  </div>`;
}

// ===== 视图切换：只有点顶部导航才换界面 =====
let CUR = 'home';
function showView(name){
  CUR = name;
  ['home','bldgs','bldg','svc','dev','ai'].forEach(v=>{
    document.getElementById('view-'+v).style.display = v===name ? '' : 'none';
  });
  document.querySelectorAll('a.nl[data-view]').forEach(a=>a.classList.toggle('on', a.dataset.view===name));
  scrollTo({top:0});
}

// ===== 模块渲染（collapsed=true 时整块折叠，用于首页） =====
function moduleHtml(key, title, collapsed){
  const secs = DATA[key]||[];
  const zh = key==='study'?'学习':'生活';
  let html = `<div class="panel"><h2><span class="modtag">${zh}</span>${esc(title)}${collapsed?`<a class="morelink" href="javascript:void(0)" onclick="showView('svc')">进入${zh}速查 →</a>`:''}</h2>`;
  if(!collapsed) html += `<div class="chips">${secs.map(s=>`<a class="chip" style="text-decoration:none" href="#st-${key}-${s.anchor}">${esc(s.name)}</a>`).join('')}</div>`;
  for(const s of secs){
    html += `<div ${collapsed?'':`id="st-${key}-${s.anchor}"`}><h3 class="blk${collapsed?' closed':''}" onclick="this.classList.toggle('closed');this.nextElementSibling.style.display=this.classList.contains('closed')?'none':''">${esc(s.name)}${s.desc?`<span style="font-weight:normal;font-size:11.5px;color:var(--gray)">${esc(s.desc)}</span>`:''}</h3><div class="bbody"${collapsed?' style="display:none"':''}>`;

function vLabelPos(s){
  let xs=[], ys=[];
  if(s[0]==='rect'){ xs=[s[1],s[3]]; ys=[s[2],s[4]]; }
  else if(s[0]==='ell'){ xs=[s[1]-s[3],s[1]+s[3]]; ys=[s[2]-s[4],s[2]+s[4]]; }
  else { s[1].forEach(p=>{xs.push(p[0]);ys.push(p[1]);}); }
  return [(Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2];
}

function initVectorMap(){
  const svg=document.getElementById('vmap'); if(!svg) return;
  const T=document.getElementById('vmapT');
  let k=1, tx=0, ty=0;
  const apply=()=>{ T.setAttribute('transform',`translate(${tx},${ty}) scale(${k})`); svg.classList.toggle('z2', k>=1.8); };
  const toSvg=(cx,cy)=>{ const r=svg.getBoundingClientRect(); const s=Math.min(r.width/1080, r.height/1152); return { x:(cx-r.left-(r.width-1080*s)/2)/s, y:(cy-r.top-(r.height-1152*s)/2)/s }; };
  const zoomAt=(f,px,py)=>{ const k2=Math.min(8,Math.max(1,k*f)); if(k2===k) return; px=px??540; py=py??576; tx=px-(px-tx)*(k2/k); ty=py-(py-ty)*(k2/k); k=k2; if(k===1){tx=0;ty=0;} apply(); };
  svg.addEventListener('wheel',e=>{ e.preventDefault(); const p=toSvg(e.clientX,e.clientY); zoomAt(e.deltaY<0?1.15:1/1.15, p.x, p.y); },{passive:false});
  const ptrs=new Map(); let moved=0, lastDist=0;
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); moved=0; if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; lastDist=Math.hypot(a.x-b.x,a.y-b.y); } });
  svg.addEventListener('pointermove',e=>{
    if(!ptrs.has(e.pointerId)) return;
    const prev={...ptrs.get(e.pointerId)}; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===1){
      const r=svg.getBoundingClientRect(); const s=Math.min(r.width/1080, r.height/1152);
      tx+=(e.clientX-prev.x)/s; ty+=(e.clientY-prev.y)/s; moved+=Math.abs(e.clientX-prev.x)+Math.abs(e.clientY-prev.y);
    } else if(ptrs.size===2){
      const [a,b]=[...ptrs.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(lastDist>0){ const p=toSvg((a.x+b.x)/2,(a.y+b.y)/2); zoomAt(d/lastDist, p.x, p.y); }
      lastDist=d; moved=99;
    }
    if(k===1){ tx=0; ty=0; }
    apply();
  });
  const end=e=>{ ptrs.delete(e.pointerId); lastDist=0; };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  svg.addEventListener('click',e=>{ if(moved>6) return; const g=e.target.closest('.vb'); if(g) openBuilding(g.dataset.id); });
  document.getElementById('vzIn').onclick=()=>zoomAt(1.4);
  document.getElementById('vzOut').onclick=()=>zoomAt(1/1.4);
  document.getElementById('vzRst').onclick=()=>{ k=1; tx=0; ty=0; apply(); };
  apply();
}

    el.style.display = ok?'':'none'; if(ok)hit++;
  });
  scope.querySelectorAll('table').forEach(t=>{
    if(!kw){ t.style.display=''; return; }
    const any=[...t.querySelectorAll('tr')].some(r=>r.style.display!=='none');
    t.style.display = any?'':'none';
  });
  qc.style.display = kw?'block':'none';
  qc.textContent = kw ? `本页匹配 ${hit} / ${total} 条` : '';
});

// 折叠状态 & 导航高亮
document.addEventListener('click',e=>{
  const a = e.target.closest('a.nl'); if(!a) return;
  document.querySelectorAll('a.nl').forEach(x=>x.classList.remove('on')); a.classList.add('on');
});
const topBtn = document.getElementById('top');
topBtn.onclick = ()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>topBtn.style.display = scrollY>600?'block':'none');
function lb(src){document.getElementById('lbimg').src=src;document.getElementById('lightbox').style.display='flex';}
document.getElementById('lightbox').onclick = ()=>document.getElementById('lightbox').style.display='none';
</script>
