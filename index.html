<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>华电保定 · 校园通</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--green:#1e7a4f;--green-d:#124a30;--green-l:#e8f4ee;--blue:#0b62c4;--gray:#68788e;--line:#dde6e0;--amber-bg:#fdf6ec;--amber:#d99a2b;--amber-t:#7a5a1e;--bmono:"Cascadia Code","JetBrains Mono",Consolas,"Courier New",monospace}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1f2733;background:#f4f7f5;line-height:1.65}
a{color:var(--blue);text-decoration:none;word-break:break-all}
a:hover{text-decoration:underline}
img{max-width:100%}
/* ===== 顶部导航 ===== */
nav{position:sticky;top:0;z-index:99;background:#fff;border-bottom:2px solid var(--green);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.nav-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:8px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;color:var(--green-d);margin-right:10px;white-space:nowrap}
.logo span{color:var(--green)}
.nav-in a.nl{padding:5px 11px;border-radius:6px;color:#2c3a4d;font-size:14px;white-space:nowrap}
.nav-in a.nl:hover,.nav-in a.nl.on{background:var(--green-l);color:var(--green-d);font-weight:bold}
.spacer{flex:1}
#q{border:1px solid var(--line);border-radius:18px;padding:6px 14px;font-size:13px;width:180px;outline:none}
#q:focus{border-color:var(--green)}
#qCount{font-size:11px;color:var(--gray);width:100%;text-align:right;padding:0 16px;display:none}
/* ===== 布局 ===== */
.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.hero{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.hero-img{position:relative;cursor:zoom-in}
.hero-img img{width:100%;display:block}
.hero-img .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff;font-size:12px;padding:22px 14px 8px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.panel>h2{font-size:20px;color:var(--green-d);border-left:5px solid var(--green);padding-left:10px;margin-bottom:6px}
.panel>.pdesc{color:var(--gray);font-size:12.5px;margin-bottom:12px}
h3.blk{font-size:15.5px;color:#124a30;margin:20px 0 8px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
h3.blk::before{content:"▾";color:var(--green);transition:.2s;font-size:12px}
h3.blk.closed::before{transform:rotate(-90deg)}
h3.blk .cnt{font-size:11px;color:#fff;background:var(--green);border-radius:10px;padding:0 8px;font-weight:normal}
.bgroup{margin-bottom:6px}
/* 卡片 */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:11px 13px;transition:.15s}
.card:hover{box-shadow:0 3px 12px rgba(30,122,79,.13);border-color:#bcd9ca}
.card .t{font-weight:bold;font-size:14px;color:var(--green-d);margin-bottom:4px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.badge{font-size:10.5px;color:#fff;background:var(--green);border-radius:4px;padding:0 6px;font-weight:normal;white-space:nowrap}
.badge.bA{background:#c0392b}.badge.bB{background:#d4791f}.badge.bC{background:#2c7fb8}.badge.bX{background:#5b8c5a}
.row{display:flex;gap:8px;margin:3px 0;font-size:12.8px}
.k{flex:0 0 58px;color:var(--gray);font-size:11.5px;text-align:justify;text-align-last:justify}
.v{flex:1;color:#2c3a4d}
.src{font-size:11px;color:#9aa7b5;margin-top:5px;border-top:1px dashed #e7ede9;padding-top:4px}
.src a{color:#7f96ab}
.steps{counter-reset:st}
.step{display:flex;gap:9px;margin:7px 0;font-size:13.5px}
.step::before{counter-increment:st;content:counter(st);flex:0 0 20px;height:20px;line-height:20px;text-align:center;background:var(--green);color:#fff;border-radius:50%;font-size:11px;font-weight:bold}
.note{background:var(--amber-bg);border-left:3px solid var(--amber);border-radius:4px;padding:7px 11px;margin:8px 0;font-size:12.5px;color:var(--amber-t)}
table{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff;margin:8px 0}
th,td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
th{background:var(--green-l);color:var(--green-d);white-space:nowrap}
.imgrow{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.imgrow figure{flex:1;min-width:260px;text-align:center}
.imgrow img{border:1px solid var(--line);border-radius:8px;width:100%}
figcaption{font-size:11px;color:var(--gray);margin-top:3px}
/* 筛选chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 12px}
.chip{border:1px solid var(--green);color:var(--green-d);background:#fff;border-radius:16px;padding:3px 14px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--green);color:#fff;font-weight:bold}
select.deptSel{border:1px solid var(--line);border-radius:16px;padding:4px 10px;font-size:12.5px;color:#2c3a4d;background:#fff;outline:none}
/* 地图灯箱 */
#lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:200;align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:96vh;border-radius:8px}
/* 快捷入口 */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.quick a{background:var(--green-l);border:1px solid #cfe6da;border-radius:9px;padding:10px;text-align:center;font-size:13px;color:var(--green-d);font-weight:bold;transition:.15s}
.quick a:hover{background:var(--green);color:#fff;text-decoration:none;transform:translateY(-2px)}
.quick a small{display:block;font-weight:normal;font-size:10.5px;margin-top:2px;opacity:.75}
#top{position:fixed;right:22px;bottom:26px;background:var(--green);color:#fff;border:none;border-radius:50%;width:42px;height:42px;font-size:18px;cursor:pointer;display:none;box-shadow:0 3px 10px rgba(0,0,0,.2);z-index:98}
.modtag{display:inline-block;background:var(--green);color:#fff;font-size:12px;border-radius:5px;padding:1px 10px;margin-right:8px;vertical-align:middle}
.lurl{display:inline-block;color:#8ba3b8;font-size:10.5px;margin-left:5px;word-break:break-all;font-weight:normal}
.quick a small.u{color:#5f7488;opacity:1}
/* 互动地图 · 蓝图HUD风格 */
.imap-hudbox{--ac:#8fd0ff;--mutb:#7fa3c8;--okb:#7dffc4;--warnb:#ffd479;
  position:relative;margin:10px 0;padding:12px 14px 14px;
  background:
    linear-gradient(rgba(150,200,255,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,200,255,.06) 1px,transparent 1px),
    linear-gradient(rgba(150,200,255,.12) 1px,transparent 1px),
    linear-gradient(90deg,rgba(150,200,255,.12) 1px,transparent 1px);
  background-size:22px 22px,22px 22px,110px 110px,110px 110px;
  background-color:#08243f;border:1px solid rgba(150,200,255,.25);color:#dcebff}
.imap-hudbox::before,.imap-hudbox::after,.imap-hudbox>.cb::before,.imap-hudbox>.cb::after{
  content:"";position:absolute;width:14px;height:14px;border:2px solid var(--ac);z-index:6;pointer-events:none}
.imap-hudbox::before{left:-2px;top:-2px;border-right:none;border-bottom:none}
.imap-hudbox::after{right:-2px;top:-2px;border-left:none;border-bottom:none}
.imap-hudbox>.cb::before{left:-2px;bottom:-2px;border-right:none;border-top:none}
.imap-hudbox>.cb::after{right:-2px;bottom:-2px;border-left:none;border-top:none}
.imap-hud{display:flex;align-items:center;justify-content:space-between;gap:8px 14px;flex-wrap:wrap;
  font-family:var(--bmono);font-size:10.5px;letter-spacing:.14em;color:var(--ac);padding:2px 2px 10px}
.imap-hud .dim{color:var(--mutb)}
.imap-hud b{color:var(--warnb);font-weight:400}
.imap-hud .tgt{color:var(--okb)}
.imap-hud .tgt::before{content:"◉ "}
.imap-hud .caret{display:inline-block;width:7px;height:1em;background:var(--okb);vertical-align:-2px;animation:hblink 1s steps(1) infinite}
@keyframes hblink{50%{opacity:0}}
.imap{position:relative;width:fit-content;max-width:100%;margin:0 auto;border:1px solid rgba(150,200,255,.35);background:rgba(6,26,46,.45);box-shadow:inset 0 0 26px rgba(4,16,32,.6)}
.imap-in{position:relative;width:fit-content;max-width:100%;margin:0 auto;font-size:0}
.imap img.mapbase{display:block;max-height:72vh;width:auto;max-width:100%;opacity:.93}
.imap .xh{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;z-index:4}
.imap-in:hover .xh{opacity:1}
.imap .xh .v{position:absolute;top:0;bottom:0;width:1px;background:rgba(143,208,255,.32)}
.imap .xh .h{position:absolute;left:0;right:0;height:1px;background:rgba(143,208,255,.32)}
.imap .xh .tag{position:absolute;font-family:var(--bmono);font-size:10px;letter-spacing:.1em;color:var(--ac);background:rgba(6,26,46,.92);border:1px solid rgba(150,200,255,.35);padding:1px 6px;white-space:nowrap;transform:translate(10px,10px)}
@media(pointer:coarse){.imap .xh{display:none}}
.imap .scan{position:absolute;left:0;right:0;top:-2%;height:2px;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,transparent,rgba(143,208,255,.5),transparent);
  animation:iscan 7s linear infinite;opacity:.65}
@keyframes iscan{0%{top:-2%}100%{top:102%}}
.mdot{position:absolute;width:15px;height:15px;margin:-15px 0 0 -7.5px;border-radius:50%;
  border:2px solid #fff;cursor:pointer;padding:0;z-index:5;
  box-shadow:0 0 6px rgba(0,0,0,.55);transition:transform .15s,box-shadow .15s;
  animation:blipIn .45s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:calc(var(--i)*22ms)}
@keyframes blipIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.4)}100%{transform:scale(1);opacity:1}}
.mdot:hover{transform:scale(1.5);box-shadow:0 0 10px 2px rgba(143,208,255,.55);z-index:8}
.mdot.on{transform:scale(1.55);box-shadow:0 0 0 3px rgba(143,208,255,.45),0 0 12px 3px rgba(143,208,255,.5);z-index:7}
.mdot.on::before{content:"";position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(143,208,255,.85);animation:ping 1.5s ease-out infinite}
@keyframes ping{0%{transform:scale(.55);opacity:.95}100%{transform:scale(2.3);opacity:0}}
.mdot::after{content:attr(data-n);position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%) translateY(2px);
  font-family:var(--bmono);font-size:10.5px;letter-spacing:.06em;color:#dcebff;white-space:nowrap;
  background:rgba(6,26,46,.92);border:1px solid rgba(150,200,255,.4);padding:1px 7px;
  opacity:0;pointer-events:none;transition:.18s;z-index:9}
.mdot:hover::after{opacity:1;transform:translateX(-50%) translateY(0)}
.mdot.c-gate{background:#e05252}.mdot.c-teach{background:#2fbf7f}.mdot.c-dorm{background:#f09b3c}.mdot.c-life{background:#41a8f0}.mdot.c-sport{background:#7dd08a}.mdot.c-spot{background:#b07ef0}
.imap-info{position:relative;background:rgba(10,40,68,.55);border:1px solid rgba(150,200,255,.28);padding:12px 15px;margin:11px 0 0;font-size:13px;color:#dcebff}
.imap-info::before,.imap-info::after,.imap-info>.cb::before,.imap-info>.cb::after{
  content:"";position:absolute;width:10px;height:10px;border:1.5px solid rgba(143,208,255,.8);pointer-events:none}
.imap-info::before{left:-1px;top:-1px;border-right:none;border-bottom:none}
.imap-info::after{right:-1px;top:-1px;border-left:none;border-bottom:none}
.imap-info>.cb::before{left:-1px;bottom:-1px;border-right:none;border-top:none}
.imap-info>.cb::after{right:-1px;bottom:-1px;border-left:none;border-top:none}
.imap-info .iread{animation:iread .38s cubic-bezier(.2,.7,.3,1)}
@keyframes iread{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.imap-info .t{font-weight:bold;font-size:15px;color:#fff;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.imap-info .readout{font-family:var(--bmono);font-size:10px;letter-spacing:.16em;color:var(--ac);margin-bottom:6px}
.imap-info .readout b{color:var(--warnb);font-weight:400}
.imap-info .catb{font-size:10.5px;color:#062036;border-radius:2px;padding:0 6px;font-weight:normal;white-space:nowrap}
.imap-info ul{margin:7px 0 2px 18px;padding:0}
.imap-info li{margin:3px 0;color:#c9def5}
.imap-info li::marker{color:var(--ac)}
.imap-info a{color:var(--okb);text-decoration:none;border-bottom:1px dashed rgba(125,255,196,.5)}
.imap-info a:hover{color:#fff;border-bottom-style:solid}
.imap-info .row .k{color:var(--mutb)}
.imap-info .row .v{color:#c9def5}
.imap-info .src{color:var(--mutb);border-top:1px dashed rgba(150,200,255,.25)}
.imap-info .src a{color:var(--mutb)}
.imap-info .ph{color:var(--mutb);font-family:var(--bmono);font-size:11.5px;letter-spacing:.08em}
.ileg{display:flex;gap:6px;flex-wrap:wrap;margin:11px 0 2px;align-items:center}
.ileg .lg-t{font-size:11px;color:var(--mutb);font-family:var(--bmono);letter-spacing:.1em}
.ileg button{border:1px solid rgba(150,200,255,.3);background:rgba(143,208,255,.06);border-radius:2px;padding:2px 10px;font-size:11.5px;cursor:pointer;color:#dcebff;display:inline-flex;align-items:center;gap:5px;transition:.2s}
.ileg button:hover{border-color:var(--ac);box-shadow:0 0 8px rgba(143,208,255,.3)}
.ileg button .d{width:9px;height:9px;border-radius:50%;display:inline-block}
.ileg button.off{opacity:.32}
.imap-list{margin-top:8px}
.ilg{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline;margin:5px 0}
.ilg .cl{font-size:11px;color:var(--mutb);flex:0 0 58px;text-align:justify;text-align-last:justify}
.ilg button{border:1px solid rgba(150,200,255,.24);background:rgba(143,208,255,.05);border-radius:2px;padding:1px 9px;font-size:11.5px;cursor:pointer;color:#cfe6ff;transition:.18s}
.ilg button:hover{background:rgba(143,208,255,.16);border-color:var(--ac);transform:translateY(-1px);box-shadow:0 0 8px rgba(143,208,255,.22)}
.ilg button.on{background:var(--ac);border-color:var(--ac);color:#062036;font-weight:bold}
.spark{position:fixed;z-index:99;pointer-events:none}
.spark i{position:absolute;left:0;top:0;width:2px;height:9px;background:var(--ac);box-shadow:0 0 6px var(--ac);animation:spk .5s ease-out forwards}
@keyframes spk{0%{transform:translate(-50%,-50%) rotate(var(--ra)) translateY(0);opacity:1}100%{transform:translate(-50%,-50%) rotate(var(--ra)) translateY(var(--rd));opacity:0}}
@media (max-width:640px){.mdot{width:19px;height:19px;margin:-19px 0 0 -9.5px;border-width:2px}.imap-hud .dim{display:none}}
@media (prefers-reduced-motion:reduce){.imap .scan,.imap-hud .caret,.mdot,.mdot.on::before,.imap-info .iread{animation:none!important}}
.morelink{float:right;font-size:12.5px;font-weight:normal}
footer{text-align:center;color:#9aa7b5;font-size:11.5px;padding:24px 16px 40px;line-height:2}
@media print{nav,#top,.chips{display:none}body{background:#fff}}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <div class="logo">华电保定<span>·校园通</span></div>
    <a class="nl on" data-view="home" href="javascript:void(0)" onclick="showView('home')">首页</a>
    <a class="nl" data-view="study" href="javascript:void(0)" onclick="showView('study')">学习</a>
    <a class="nl" data-view="life" href="javascript:void(0)" onclick="showView('life')">生活</a>
    <a class="nl" data-view="ai" href="javascript:void(0)" onclick="showView('ai')">AI 接入</a>
    <a class="nl" data-view="dev" href="javascript:void(0)" onclick="showView('dev')">开发者寄语</a>
    <div class="spacer"></div>
    <input id="q" type="search" placeholder="搜索内容…（如：数学建模 / 报修）">
  </div>
  <div id="qCount"></div>
</nav>

<div class="wrap" id="app">
  <div class="view" id="view-home">页面生成中…（若长期无响应请检查 data.js 是否在同目录）</div>
  <div class="view" id="view-study" style="display:none"></div>
  <div class="view" id="view-life" style="display:none"></div>
  <div class="view" id="view-dev" style="display:none"></div>
  <div class="view" id="view-ai" style="display:none"><iframe src="ai-kit/index.html" title="校园 AI 接入指南" style="width:100%;height:calc(100vh - 120px);border:1px solid var(--line);border-radius:12px;background:#fff"></iframe></div>
</div>

<div id="lightbox"><img id="lbimg" src="" alt=""></div>
<button id="top" title="回到顶部">↑</button>

<footer id="foot"></footer>

<script src="data.js?v=202610061500"></script>
<script>
const app = document.getElementById('app');
const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// 每个超链接后面跟着链接的实际字符串
const urlTail = u => (u && u.startsWith('http')) ? `<span class="lurl">${esc(u)}</span>` : '';
const linkHtml = l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}${urlTail(l[1])}</a>`;
const quickTile = l => `<a href="${esc(l[1])}" target="_blank" rel="noopener">${esc(l[0])}<small>${esc(l[2]||'')}</small><small class="u">${esc(l[1])}</small></a>`;
const srcHtml = b => b.src ? `<div class="src">来源：${b.srcUrl ? `<a href="${esc(b.srcUrl)}" target="_blank" rel="noopener">${esc(b.src)}${urlTail(b.srcUrl)}</a>` : esc(b.src)}</div>` : '';

// ===== 正文裸网址 / 电话 → 可点击链接名 =====
const URL_RE = /([a-zA-Z0-9._%+-]+@[a-zA-Z0-9-]+(?:\.[a-zA-Z0-9-]+)*\.[a-zA-Z]{2,})|(https?:\/\/[^\s<>"，。；、）】』》！!？?]+|www\.[^\s<>"，。；、）】』》]+|\b[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:com|cn|net|org|cc|io|xyz|top)(?:\/[^\s<>"，。；、）】』》]*)?)/gi;
function linkify(s){
  if(s==null) return '';
  return s.toString().split(/(<a\s[^>]*>[\s\S]*?<\/a>)|(<[^>]+>)/gi).map(seg=>{
    if(seg==null) return '';
    if(seg.charAt(0)==='<') return seg;
    let out = seg.replace(URL_RE, u=>{
      if(/^[^/@]+@[^/@]+\.[a-zA-Z]{2,}$/.test(u)) return `<a href="mailto:${u}">${u}</a>`;
      const raw = u.replace(/[.,;:!?)\]}"'’”』」]+$/, '');
      const tail = u.slice(raw.length);
      const href = (/^https?:\/\//i.test(raw) ? raw : 'https://' + raw).replace(/"/g,'%22');
      let txt = raw.replace(/^https?:\/\//i,'');
      if(txt.length>60) txt = txt.slice(0,57)+'…';
      return `<a href="${href}" target="_blank" rel="noopener" title="${esc(raw)}">${esc(txt)}</a>${tail}`;
    });
    out = out.replace(/0312-\d{7}|\b1[3-9]\d{9}\b/g, m=>`<a href="tel:${m}">${m}</a>`);
    return out;
  }).join('');
}

function cardHtml(c){
  const badge = c.badge ? `<span class="badge ${c.badgeCls||''}">${esc(c.badge)}</span>` : '';
  const rows = (c.rows||[]).map(r=>`<div class="row"><span class="k">${esc(r[0])}</span><span class="v">${linkify(r[1])}</span></div>`).join('');
  const links = (c.links&&c.links.length) ? `<div class="row"><span class="k">链接</span><span class="v">${c.links.map(linkHtml).join('<br>')}</span></div>` : '';
  const tags = (c.tags||[]).join(' ').replace(/"/g,'&quot;');
  return `<div class="card" data-tags="${esc(tags)}">
    <div class="t">${badge}${esc(c.t)}</div>${rows}${links}
    ${c.note?`<div class="note">${linkify(c.note)}</div>`:''}${srcHtml(c)}</div>`;
}

function blockHtml(b){
  if(b.type==='cards'){
    const inner = `<div class="cards">${(b.items||[]).map(cardHtml).join('')}</div>`;
    const head = b.t ? `<div style="font-weight:bold;font-size:13.5px;color:#124a30;margin:10px 0 2px">${esc(b.t)}</div>` : '';
    return head + (b.filter ? filterBar(b) + inner : inner);
  }
  if(b.type==='table') return `<table>${(b.headers?`<tr>${b.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`:'')}${b.rows.map(r=>`<tr>${r.map(c=>`<td>${linkify(c)}</td>`).join('')}</tr>`).join('')}</table>${srcHtml(b)}`;
  if(b.type==='steps') return `<div class="steps">${b.items.map(s=>`<div class="step"><span><b>${linkify(s.t)}</b>${s.t?'<br>':''}${linkify(s.d||'')}</span></div>`).join('')}</div>${srcHtml(b)}`;
  if(b.type==='note') return `<div class="note">${linkify(b.text)}</div>`;
  if(b.type==='text') return `<div style="font-size:13.5px;margin:6px 0">${linkify(b.html)}</div>`;
  if(b.type==='imgs') return `<div class="imgrow">${b.items.map(i=>`<figure><img src="${esc(i.src)}" loading="lazy" alt=""><figcaption>${esc(i.cap||'')}</figcaption></figure>`).join('')}</div>`;
  if(b.type==='links') return `<div class="quick">${b.items.map(quickTile).join('')}</div>`;
  if(b.type==='list') return `<ul style="margin:6px 0 6px 20px;font-size:13px">${b.items.map(x=>`<li style="margin:4px 0">${linkify(x)}</li>`).join('')}</ul>${srcHtml(b)}`;
  return '';
}

function groupHtml(g){
  const body = (b=>Array.isArray(b)?b:[b])(g.blocks).map(blockHtml).join('');
  const cntMatch = body.match(/class="card"/g);
  const cnt = g.count!=null ? g.count : (cntMatch?cntMatch.length:0);
  return `<div class="bgroup"><h3 class="blk" onclick="this.classList.toggle('closed');this.nextElementSibling.style.display=this.classList.contains('closed')?'none':''">${esc(g.t)}<span class="cnt">${cnt}</span></h3><div class="bbody">${body}</div></div>`;
}

function filterBar(b){
  const depts = [...new Set(b.items.map(c=>c.tags?c.tags[1]:'').filter(Boolean))].sort();
  return `<div class="chips">
    <span style="font-size:12px;color:var(--gray)">筛选：</span>
    <button class="chip on" data-f="all">全部</button>
    <button class="chip" data-f="A">A类</button>
    <button class="chip" data-f="B">B类</button>
    <button class="chip" data-f="C">其他</button>
    <button class="chip" data-f="X">校内</button>
    <span style="font-size:12px;color:var(--gray)">院系（承办·建议参加）：</span><select class="deptSel"><option value="">全部</option>${depts.map(d=>`<option>${esc(d)}</option>`).join('')}</select>
  </div>`;
}

// ===== 视图切换：只有点顶部导航才换界面 =====
let CUR = 'home';
function showView(name){
  CUR = name;
  ['home','study','life','dev','ai'].forEach(v=>{
    document.getElementById('view-'+v).style.display = v===name ? '' : 'none';
  });
  document.querySelectorAll('a.nl[data-view]').forEach(a=>a.classList.toggle('on', a.dataset.view===name));
  scrollTo({top:0});
}

// ===== 模块渲染（collapsed=true 时整块折叠，用于首页） =====
function moduleHtml(key, title, collapsed){
  const secs = DATA[key]||[];
  const zh = key==='study'?'学习':'生活';
  let html = `<div class="panel"><h2><span class="modtag">${zh}</span>${esc(title)}${collapsed?`<a class="morelink" href="javascript:void(0)" onclick="showView('${key}')">进入${zh}模块 →</a>`:''}</h2>`;
  if(!collapsed) html += `<div class="chips">${secs.map(s=>`<a class="chip" style="text-decoration:none" href="#st-${key}-${s.anchor}">${esc(s.name)}</a>`).join('')}</div>`;
  for(const s of secs){
    html += `<div ${collapsed?'':`id="st-${key}-${s.anchor}"`}><h3 class="blk${collapsed?' closed':''}" onclick="this.classList.toggle('closed');this.nextElementSibling.style.display=this.classList.contains('closed')?'none':''">${esc(s.name)}${s.desc?`<span style="font-weight:normal;font-size:11.5px;color:var(--gray)">${esc(s.desc)}</span>`:''}</h3><div class="bbody"${collapsed?' style="display:none"':''}>`;
    for(const b of s.blocks||[]) html += blockHtml(b);
    html += `</div></div>`;
  }
  return html + '</div>';
}

// ===== 互动地图 · 蓝图HUD =====
const MB = DATA.mapBuildings||null;
const CATC = {gate:'#e05252',teach:'#2fbf7f',dorm:'#f09b3c',life:'#41a8f0',sport:'#7dd08a',spot:'#b07ef0'};
function spark(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b=document.createElement('div');b.className='spark';b.style.cssText=`left:${x}px;top:${y}px`;
  for(let i=0;i<8;i++){
    const s=document.createElement('i');
    s.style.setProperty('--ra',(i/8*360)+'deg');
    s.style.setProperty('--rd',(20+Math.random()*18)+'px');
    s.style.animationDelay=(Math.random()*40)+'ms';
    b.appendChild(s);
  }
  document.body.appendChild(b);setTimeout(()=>b.remove(),600);
}
function openMapB(id){
  if(!MB) return;
  const b = MB.items.find(x=>x.id===id);
  if(!b) return;
  document.querySelectorAll('#imap .mdot').forEach(d=>d.classList.toggle('on', d.dataset.id===id));
  document.querySelectorAll('#imapList button').forEach(x=>x.classList.toggle('on', x.dataset.id===id));
  const pts = (b.pts||[]).concat(b.c==='dorm' ? (MB.dormCommonPts||[]) : []);
  const links = (b.lk&&b.lk.length) ? `<div class="row"><span class="k">链接</span><span class="v">${b.lk.map(linkHtml).join('<br>')}</span></div>` : '';
  const box = document.getElementById('imapInfo');
  box.innerHTML = `<i class="cb"></i><div class="iread"><div class="readout">&gt; TARGET_LOCK [<b>${esc(b.num||'--')}</b>] // CAT:${esc((MB.cats[b.c]||'')).toUpperCase()} // POS ${b.x}%/${b.y}%</div>
  <div class="t">${esc(b.n)}<span class="catb" style="background:${CATC[b.c]||'#2fbf7f'}">${esc(MB.cats[b.c]||'')}</span>${b.num?`<span class="catb" style="background:var(--amber);color:#4a3305">${esc(b.num)}</span>`:''}</div>
  <div style="margin-top:4px">${linkify(b.d)}</div>
  ${pts.length?`<ul>${pts.map(p=>`<li>${linkify(p)}</li>`).join('')}</ul>`:''}${links}
  ${b.src?`<div class="src">来源：${esc(b.src)}</div>`:''}</div>`;
}
function imapPanelHtml(){
  const dots = MB.items.map((b,i)=>`<button class="mdot c-${b.c}" style="left:${b.x}%;top:${b.y}%;--i:${i}" data-id="${b.id}" data-n="${esc(b.n)}" aria-label="${esc(b.n)}"></button>`).join('');
  const legend = `<span class="lg-t">图层/点击显隐</span>` + Object.keys(MB.cats).map(c=>`<button data-cat="${c}"><span class="d" style="background:${CATC[c]}"></span>${esc(MB.cats[c])}</button>`).join('');
  const list = Object.keys(MB.cats).map(c=>{
    const its = MB.items.filter(b=>b.c===c);
    return `<div class="ilg" data-cat="${c}"><span class="cl">${esc(MB.cats[c])}</span>${its.map(b=>`<button data-id="${b.id}">${esc(b.n)}</button>`).join('')}</div>`;
  }).join('');
  return `<div class="imap-hudbox"><i class="cb"></i>
  <div class="imap-hud"><span>NCEPU·BD // 二校区 <span class="dim">CAMPUS-MAP</span></span><span class="dim">X:<b id="imapX">--</b> Y:<b id="imapY">--</b></span><span class="tgt">${MB.items.length} TARGETS</span><span class="caret"></span></div>
  <div class="imap" id="imap"><div class="imap-in"><img class="mapbase" src="${esc(DATA.mapImg)}" alt="二校区互动地图"><div class="xh"><i class="v"></i><i class="h"></i><span class="tag"></span></div><div class="scan"></div>${dots}</div></div>
  <div id="imapInfo" class="imap-info"><i class="cb"></i><span class="ph">&gt; STANDBY // 点击地图圆点或下方目标列表，查看建筑详情…</span></div>
  <div class="ileg" id="imapLegend">${legend}</div>
  <div class="imap-list" id="imapList">${list}</div></div>`;
}

// ===== 首页：只有 地图 + 学校简介 + 折叠的学习/生活模块 =====
function renderHome(){
  const I = DATA.intro;
  let html = `<div class="panel"><h2>${esc(I.title)}</h2>
  <div class="pdesc">${I.sub}</div>
  ${MB ? imapPanelHtml() : `<div class="hero-img" onclick="lb(this.querySelector('img').src)"><img src="${esc(DATA.mapImg)}" alt="二校区地图"><div class="cap">${esc(DATA.mapCap)}（点击放大）</div></div>`}
  <div style="font-size:13.5px;margin-top:12px">${linkify(I.text)}</div>${I.src?srcHtml(I):''}
  <h3 class="blk closed" onclick="this.classList.toggle('closed');this.nextElementSibling.style.display=this.classList.contains('closed')?'none':''">地图注记</h3><div style="display:none">${blockHtml({type:'list',items:DATA.mapNotes,src:'来源：网络'})}</div></div>`;
  html += moduleHtml('study','学习模块（点击展开）',true);
  html += moduleHtml('life','生活模块（点击展开）',true);
  html += `<div class="panel"><h3 class="blk closed" style="margin:0" onclick="this.classList.toggle('closed');this.nextElementSibling.style.display=this.classList.contains('closed')?'none':''">常用网址（快捷入口）</h3><div style="display:none"><div class="quick">${DATA.quickLinks.map(quickTile).join('')}</div></div></div>`;
  document.getElementById('view-home').innerHTML = html;
}

// ===== 开发者寄语 =====
function renderDev(){
  const D = DATA.dev;
  let html = `<div class="panel"><h2>开发者寄语</h2>
  <div style="font-size:13.5px;margin-top:8px">${linkify(D.msg)}</div>
  ${D.pdfUrl?`<div class="note">本指南 PDF 完整版下载：<a href="${esc(D.pdfUrl)}" target="_blank" rel="noopener"><b>${esc(D.pdfName||'PDF 下载')}</b><span class="lurl">${esc(D.pdfUrl)}</span></a></div>`:''}</div>`;
  html += `<div class="panel"><h2>内容来源网址汇总</h2><div class="pdesc">本站所有信息的来源链接，共 ${D.sources.length} 条（分类排列，点击网址可直接打开）</div>
  <table><thead><tr><th style="width:90px">类别</th><th>网站/页面</th><th>网址</th></tr></thead><tbody>${
    D.sources.map(s=>`<tr><td>${esc(s[0])}</td><td>${s[2]?`<a href="${esc(s[2])}" target="_blank" rel="noopener">${esc(s[1])}</a>`:esc(s[1])}</td><td>${s[2]?`<a href="${esc(s[2])}" target="_blank" rel="noopener">${esc(s[2])}</a>`:'—'}</td></tr>`).join('')
  }</tbody></table></div>`;
  document.getElementById('view-dev').innerHTML = html;
}

// ===== 主流程 =====
renderHome();
if(MB){
  document.getElementById('imap').addEventListener('click',e=>{
    const d=e.target.closest('.mdot');
    if(d){ openMapB(d.dataset.id); spark(e.clientX,e.clientY); }
  });
  /* 准星十字线 + HUD 坐标读数（仅鼠标设备） */
  if(matchMedia('(pointer:fine)').matches){
    const imapIn=document.querySelector('.imap-in');
    const xh=document.querySelector('#imap .xh');
    const tag=xh.querySelector('.tag');
    imapIn.addEventListener('mousemove',e=>{
      const r=imapIn.getBoundingClientRect();
      const px=(e.clientX-r.left)/r.width*100, py=(e.clientY-r.top)/r.height*100;
      xh.querySelector('.v').style.left=px+'%';
      xh.querySelector('.h').style.top=py+'%';
      tag.style.left=px+'%'; tag.style.top=py+'%';
      tag.textContent='X:'+px.toFixed(1)+' Y:'+py.toFixed(1);
      const hx=document.getElementById('imapX'), hy=document.getElementById('imapY');
      if(hx){ hx.textContent=px.toFixed(1); hy.textContent=py.toFixed(1); }
    });
    imapIn.addEventListener('mouseleave',()=>{
      const hx=document.getElementById('imapX');
      if(hx){ hx.textContent='--'; document.getElementById('imapY').textContent='--'; }
    });
  }
  document.getElementById('imapLegend').addEventListener('click',e=>{
    const btn=e.target.closest('button[data-cat]'); if(!btn) return;
    btn.classList.toggle('off');
    const off=[...document.querySelectorAll('#imapLegend button.off')].map(x=>x.dataset.cat);
    document.querySelectorAll('#imap .mdot').forEach(d=>{
      const b=MB.items.find(x=>x.id===d.dataset.id);
      d.style.display=(b&&off.includes(b.c))?'none':'';
    });
    document.querySelectorAll('#imapList .ilg').forEach(g=>{g.style.display=off.includes(g.dataset.cat)?'none':'';});
  });
  document.getElementById('imapList').addEventListener('click',e=>{
    const btn=e.target.closest('button[data-id]'); if(btn) openMapB(btn.dataset.id);
  });
}
document.getElementById('view-study').innerHTML = moduleHtml('study','学习',false);
document.getElementById('view-life').innerHTML = moduleHtml('life','生活',false);
renderDev();
document.getElementById('foot').innerHTML = DATA.footer;

// 竞赛筛选
document.querySelectorAll('.chips').forEach(ch=>{
  if(!ch.querySelector('[data-f="A"]')) return;
  ch.addEventListener('click',e=>{
    if(e.target.classList.contains('chip')){
      ch.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
      e.target.classList.add('on');
      applyContestFilter(ch);
    }
  });
  ch.querySelector('.deptSel').addEventListener('change',()=>applyContestFilter(ch));
});
function applyContestFilter(ch){
  const f = ch.querySelector('.chip.on').dataset.f;
  const d = ch.querySelector('.deptSel').value;
  let n=0;
  ch.parentElement.querySelectorAll('.card').forEach(c=>{
    const tags = (c.dataset.tags||'').split(' ');
    const lv = tags[0]||''; const dept = tags[1]||'';
    const ok = (f==='all'||lv===f) && (!d||dept===d);
    c.style.display = ok?'':'none'; if(ok)n++;
  });
}

// 全局搜索（限定当前视图；搜索时自动展开折叠的节）
const q = document.getElementById('q'), qc = document.getElementById('qCount');
q.addEventListener('input',()=>{
  const kw = q.value.trim().toLowerCase();
  const scope = document.getElementById('view-'+CUR);
  if(kw){
    scope.querySelectorAll('h3.blk.closed').forEach(h=>{h.classList.remove('closed');h.nextElementSibling.style.display='';});
    scope.querySelectorAll('.bbody').forEach(b=>{if(b.style.display==='none')b.style.display='';});
  }
  let total=0, hit=0;
  scope.querySelectorAll('.card,.step,tbody tr').forEach(el=>{
    total++;
    const ok = !kw || el.textContent.toLowerCase().includes(kw);
    el.style.display = ok?'':'none'; if(ok)hit++;
  });
  scope.querySelectorAll('table').forEach(t=>{
    if(!kw){ t.style.display=''; return; }
    const any=[...t.querySelectorAll('tr')].some(r=>r.style.display!=='none');
    t.style.display = any?'':'none';
  });
  qc.style.display = kw?'block':'none';
  qc.textContent = kw ? `本页匹配 ${hit} / ${total} 条` : '';
});

// 折叠状态 & 导航高亮
document.addEventListener('click',e=>{
  const a = e.target.closest('a.nl'); if(!a) return;
  document.querySelectorAll('a.nl').forEach(x=>x.classList.remove('on')); a.classList.add('on');
});
const topBtn = document.getElementById('top');
topBtn.onclick = ()=>scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>topBtn.style.display = scrollY>600?'block':'none');
function lb(src){document.getElementById('lbimg').src=src;document.getElementById('lightbox').style.display='flex';}
document.getElementById('lightbox').onclick = ()=>document.getElementById('lightbox').style.display='none';
</script>
</body>
</html>
